name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly link check: Mondays 06:00 UTC.
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Validate, typecheck and build
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Validate graph data
        run: npm run validate
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build

  links:
    name: Check node URLs
    # External sites can be flaky, so this runs on a schedule or manually,
    # never as a merge blocker.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run check-urls
